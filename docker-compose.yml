services:
  pdf-converter:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - HTTP_ADDR=:8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CONVERT_TIMEOUT=${CONVERT_TIMEOUT:-10s}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-20}
    deploy:
      replicas: ${PDF_CONVERTER_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - fast_pdf_network

networks:
  fast_pdf_network:
    external: true
